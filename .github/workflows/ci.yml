name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests de cálculo
        run: pnpm test

      - name: Red de enlaces internos
        run: pnpm links:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Guías
        run: pnpm guides:check

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build

      - name: Auditoría SEO/GEO
        run: pnpm audit:seo
