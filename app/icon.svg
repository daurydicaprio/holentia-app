<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>HOLENTIA</title>
  <style>
    @media (prefers-color-scheme: light) {
      .holentia-bg { fill: #121212; }
      .holentia-mark { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .holentia-bg { fill: #f8f9fa; }
      .holentia-mark { fill: #121212; }
    }
  </style>
  <rect class="holentia-bg" width="180" height="180" rx="44" fill="#121212" />
  <g class="holentia-mark" fill="#ffffff">
    <rect x="48" y="48" width="22" height="84" rx="6" />
    <rect x="110" y="48" width="22" height="84" rx="6" />
    <rect x="70" y="81" width="40" height="18" rx="6" />
  </g>
</svg>
